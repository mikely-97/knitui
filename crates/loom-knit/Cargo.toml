[package]
name = "loom-knit"
version = "0.1.0"
edition = "2024"

[lib]
name = "knitui"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "knitui"
path = "src/main.rs"

[[bin]]
name = "knitui-ni"
path = "src/bin/knitui_ni.rs"

[[bin]]
name = "knitui-solvcheck"
path = "src/bin/knitui_solvcheck.rs"

[[bin]]
name = "knitui-replay"
path = "src/bin/knitui_replay.rs"

[[bin]]
name = "knitui-editor"
path = "src/bin/knitui_editor.rs"

[dependencies]
loom-engine = { path = "../loom-engine" }
rand = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
loom-engine-term = { path = "../loom-engine-term" }
crossterm = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
loom-engine-web = { path = "../loom-engine-web" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["CanvasRenderingContext2d", "KeyboardEvent"]
