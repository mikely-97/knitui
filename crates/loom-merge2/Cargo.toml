[package]
name = "loom-merge2"
version = "0.1.0"
edition = "2024"

[lib]
name = "m2tui"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
loom-engine = { path = "../loom-engine" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
loom-engine-term = { path = "../loom-engine-term" }
crossterm = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
loom-engine-web = { path = "../loom-engine-web" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["CanvasRenderingContext2d", "KeyboardEvent"]
