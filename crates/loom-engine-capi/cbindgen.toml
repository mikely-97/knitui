language = "C"
cpp_compat = true
header = """
/* Generated by cbindgen from crates/loom-engine-capi/src/lib.rs.
 * Do not edit by hand -- run `cbindgen --config cbindgen.toml --crate loom-engine-capi --output include/loom.h`
 * from this directory after changing the Rust API, and commit the result. */
"""
include_guard = "LOOM_ENGINE_CAPI_H"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"

[export]
prefix = ""

[fn]
prefix = ""
