<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>match3 (web)</title>
<style>
  body { background: #111; color: #ccc; font-family: monospace; }
  canvas { background: black; display: block; margin: 1rem auto; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<p style="text-align:center">Same menus, campaign, and options as the terminal build. Arrow keys navigate, Enter selects, Esc backs out.</p>
<script type="module">
  import init, { WebGame } from './pkg/m3tui.js';

  async function main() {
    await init();

    const canvas = document.getElementById('game');
    const fontPx = 16;
    const cols = 100;
    const rows = 40;
    canvas.width = Math.ceil(cols * fontPx * 0.6);
    canvas.height = Math.ceil(rows * fontPx * 1.2);

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const game = new WebGame(ctx, cols, rows, fontPx);

    window.addEventListener('keydown', (e) => {
      game.handle_key(e);
      e.preventDefault();
    });

    window.addEventListener('beforeunload', () => {
      game.save_on_exit();
    });

    // Ticks every animation frame (~60fps), not the native build's ~50ms
    // poll cadence -- each frontend owns its own timing (see
    // loom-engine::shell's doc comment), so cascades/animations just run
    // faster here than in the terminal build.
    function frame() {
      game.tick();
      game.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  main();
</script>
</body>
</html>
